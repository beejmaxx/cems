name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  generated-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_public_tree.py
      - run: make -j2 build CXX=clang++
      - run: make test test-large CXX=clang++
